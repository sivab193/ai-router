[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-router-control"
version = "0.1.0"
description = "Control plane and outbound relay for ephemeral vLLM runners"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_router_control"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
