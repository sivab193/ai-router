name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-router-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest
      - run: uv run python -m compileall -q src tests scripts/provision-control-key.py
      - run: bash -n scripts/*.sh
      - run: docker compose --env-file .env.example config --quiet

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Package release
        run: git archive --format=tar.gz -o "/tmp/ai-router-${GITHUB_SHA}.tar.gz" HEAD
      - name: Upload release through IAP
        run: |
          cp scripts/deploy-release.sh "/tmp/deploy-release-${GITHUB_SHA}.sh"
          gcloud compute scp \
            --project="${{ secrets.GCP_PROJECT }}" \
            --zone="${{ secrets.GCP_ZONE }}" \
            --tunnel-through-iap \
            "/tmp/ai-router-${GITHUB_SHA}.tar.gz" \
            "/tmp/deploy-release-${GITHUB_SHA}.sh" \
            "${{ secrets.GCP_VM }}:/tmp/"
      - name: Activate release
        run: >-
          gcloud compute ssh "${{ secrets.GCP_VM }}"
          --project="${{ secrets.GCP_PROJECT }}"
          --zone="${{ secrets.GCP_ZONE }}"
          --tunnel-through-iap
          --command="sudo bash /tmp/deploy-release-${GITHUB_SHA}.sh /tmp/ai-router-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
      - name: Verify production
        run: >-
          gcloud compute ssh "${{ secrets.GCP_VM }}"
          --project="${{ secrets.GCP_PROJECT }}"
          --zone="${{ secrets.GCP_ZONE }}"
          --tunnel-through-iap
          --command="
            curl --fail --show-error --silent --retry 12 --retry-delay 5 http://127.0.0.1:8088/healthz -H 'Host: ${{ secrets.PUBLIC_HOST }}' &&
            test \"\$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/ -H 'Host: ${{ secrets.PUBLIC_HOST }}')\" = 404 &&
            test \"\$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/control/v1/runners -H 'Host: ${{ secrets.PUBLIC_HOST }}')\" = 404 &&
            test \"\$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/v1/models -H 'Host: ${{ secrets.PUBLIC_HOST }}')\" = 401
          "
