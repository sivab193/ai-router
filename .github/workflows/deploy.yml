name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-router-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest
      - run: uv run python -m compileall -q src tests scripts/provision-control-key.py
      - run: bash -n scripts/*.sh
      - run: docker compose --env-file .env.example config --quiet

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/370062953948/locations/global/workloadIdentityPools/github-actions/providers/ai-router
          service_account: ai-router-deployer@aayvu-513001.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Package release
        run: git archive --format=tar.gz -o "/tmp/ai-router-${GITHUB_SHA}.tar.gz" HEAD
      - name: Upload release through IAP
        run: |
          cp scripts/deploy-release.sh "/tmp/deploy-release-${GITHUB_SHA}.sh"
          gcloud compute scp \
            --project=aayvu-513001 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            "/tmp/ai-router-${GITHUB_SHA}.tar.gz" \
            "/tmp/deploy-release-${GITHUB_SHA}.sh" \
            ai-router-gateway:/tmp/
      - name: Activate release
        run: >-
          gcloud compute ssh ai-router-gateway
          --project=aayvu-513001
          --zone=us-central1-a
          --tunnel-through-iap
          --command="sudo bash /tmp/deploy-release-${GITHUB_SHA}.sh /tmp/ai-router-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
      - name: Verify production
        run: >-
          gcloud compute ssh ai-router-gateway
          --project=aayvu-513001
          --zone=us-central1-a
          --tunnel-through-iap
          --command="
            curl --fail --show-error --silent --retry 12 --retry-delay 5 http://127.0.0.1:8088/healthz -H 'Host: ai.siv19.dev' &&
            test \"\$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/ -H 'Host: ai.siv19.dev')\" = 404 &&
            test \"\$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/control/v1/runners -H 'Host: ai.siv19.dev')\" = 404 &&
            test \"\$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/v1/models -H 'Host: ai.siv19.dev')\" = 401
          "
